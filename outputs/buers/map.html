<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Carte diagnostic UFS</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
 html, body, #map { height: 100%; margin: 0; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CAT_COLORS = { alimentation_locale_bio: "#e67e22", commerces_bio_sirene: "#8e44ad", espaces_verts: "#27ae60", eau_potable: "#2980b9", acces_soins_pharmacies: "#c0392b" };
const CAT_LABELS = { alimentation_locale_bio: "Alimentation locale/bio", commerces_bio_sirene: "Commerce bio (Sirene 4729Z)", espaces_verts: "Espaces verts", eau_potable: "Eau potable", acces_soins_pharmacies: "Pharmacie" };

const map = L.map("map");
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  attribution: "&copy; OpenStreetMap (ODbL)", maxZoom: 19
}).addTo(map);

const overlays = {};

Promise.all([
  fetch("indicators.geojson").then(r => r.json()),
  fetch("pois.geojson").then(r => r.json()),
  fetch("isochrone.geojson").then(r => r.json()).catch(() => null)
]).then(([cells, pois, iso]) => {
  const layer = L.geoJSON(cells, {
    style: f => {
      const s = f.properties.score;
      const color = s === null ? "#999" : s > 0.66 ? "#2ecc71" : s > 0.33 ? "#f1c40f" : "#e74c3c";
      return { color: "#555", weight: 1, fillColor: color, fillOpacity: 0.55 };
    },
    onEachFeature: (f, l) => {
      const p = f.properties;
      let html = `<b>${p.id}</b> — score ${p.score}<br>`;
      for (const [k, v] of Object.entries(p.indicators || {})) {
        const net = v.min_dist_reseau_m !== undefined ? `, réseau ${v.min_dist_reseau_m} m` : "";
        html += `${CAT_LABELS[k] || k} : ${v.count_within} à ≤${p.radius_m || 800}m, min ${v.min_dist_m} m${net}<br>`;
      }
      l.bindPopup(html);
    }
  });
  overlays["Mailles (score d'accès)"] = layer;
  layer.addTo(map);
  map.fitBounds(layer.getBounds());

  const byCat = {};
  pois.features.forEach(f => { (byCat[f.properties.category] = byCat[f.properties.category] || []).push(f); });
  for (const [cat, feats] of Object.entries(byCat)) {
    const l2 = L.geoJSON({ type: "FeatureCollection", features: feats }, {
      pointToLayer: (f, latlng) => L.circleMarker(latlng, {
        radius: 6, color: "#fff", weight: 1, fillColor: CAT_COLORS[cat] || "#333", fillOpacity: 0.9
      }),
      onEachFeature: (f, l) => l.bindPopup(`<b>${f.properties.name}</b><br>${CAT_LABELS[cat] || cat}<br><small>${f.properties.detail || ""}</small>`)
    });
    overlays[CAT_LABELS[cat] || cat] = l2;
    l2.addTo(map);
  }

  if (iso && iso.features && iso.features.length) {
    const l3 = L.geoJSON(iso, {
      style: { color: "#8e44ad", weight: 5, opacity: 0.6 },
      onEachFeature: (f, l) => l.bindPopup(`Isochrone ~${f.properties.isochrone_m} m à pied<br>${f.properties.libelle || ""}`)
    });
    overlays["Isochrone 10 min à pied (réseau)"] = l3;
    l3.addTo(map);
  }

  L.control.layers(null, overlays, { collapsed: false }).addTo(map);
});
</script>
</body>
</html>
